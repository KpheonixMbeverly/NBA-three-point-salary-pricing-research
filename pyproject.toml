[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-three-point-salary-pricing"
version = "0.1.0"
description = "Reproducible observational analysis of NBA three-point skill and salaries, 2000–2025"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.7,<4",
  "Pillow>=10,<13",
  "scipy>=1.10,<2"
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
nba-pricing = "nba_pricing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
